zerops:
  # Frontend Static Service
  - setup: gui
    build:
      base: nodejs@20
      buildCommands:
        - |
          cd frontend
          npm ci
          npm run build
      deployFiles:
        - frontend/dist/~
      cache:
        - frontend/node_modules
    run:
      base: static

  # Backend Node.js Service
  - setup: api
    build:
      base: nodejs@20
      buildCommands:
        - |
          cd backend
          npm ci
          npx prisma generate
          npm run build
      deployFiles:
        - backend
      cache:
        - backend/node_modules
    run:
      base: nodejs@20
      ports:
        - port: 5000
          httpSupport: true
      initCommands:
        - |
          cd backend
          npx prisma db push
          node prisma/seed.js
      start: cd backend && npm run start
